{{- if and .IsPage (eq .Section "blog") -}}
<script>
(() => {
  const theme = () => document.documentElement.getAttribute('data-bs-theme') === 'dark' ? 'github-dark' : 'github-light';
  const syncTheme = () => {
    const frame = document.querySelector('iframe.utterances-frame');
    if (frame) frame.contentWindow.postMessage({ type: 'set-theme', theme: theme() }, 'https://utteranc.es');
  };
  document.addEventListener('load', event => {
    if (event.target.matches && event.target.matches('iframe.utterances-frame')) syncTheme();
  }, true);
  new MutationObserver(syncTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-bs-theme'] });

  const script = document.createElement('script');
  script.src = 'https://utteranc.es/client.js';
  script.setAttribute('repo', 'spin6lock/spin6lock.github.io');
  script.setAttribute('issue-term', 'og:title');
  script.setAttribute('label', 'Comment');
  script.setAttribute('theme', theme());
  script.crossOrigin = 'anonymous';
  script.async = true;
  document.currentScript.parentNode.insertBefore(script, document.currentScript);
})();
</script>
{{- end -}}
